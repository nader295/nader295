      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e2e8f0" opacity="0.16"/>
    </pattern>
    <clipPath id="clip">
      <circle cx="220" cy="220" r="214"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="440" height="440" fill="url(#bg)"/>
    <rect width="440" height="440" fill="url(#dots)"/>
    <rect width="440" height="440" fill="url(#glow)"/>

    <g stroke="url(#ring)" stroke-width="3" fill="none" opacity="0.55">
      <path d="M 40 340 L 120 340 L 150 310"/>
      <path d="M 400 100 L 320 100 L 290 130"/>
      <path d="M 372 372 L 300 372 L 282 354"/>
    </g>
    <g fill="#22d3ee" opacity="0.9">
