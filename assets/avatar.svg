      <circle cx="400" cy="100" r="5"/>
      <circle cx="372" cy="372" r="5"/>
    </g>

    <text x="220" y="252" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="200" font-weight="700" fill="url(#mono)">N</text>

    <text x="220" y="330" text-anchor="middle"
          font-family="'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace"
          font-size="44" font-weight="600" fill="url(#ring)" letter-spacing="2">nader295</text>

    <text x="220" y="378" text-anchor="middle"
          font-family="'Noto Sans Arabic', 'Segoe UI', 'Traditional Arabic', sans-serif"
          font-size="30" fill="#93c5fd" opacity="0.85">مطوّر أندرويد</text>
  </g>

  <circle cx="220" cy="220" r="209" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <circle cx="220" cy="220" r="216" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.5"/>
